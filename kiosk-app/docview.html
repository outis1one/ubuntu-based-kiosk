<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Document</title>
<!-- Shown for a site that's a local .docx file - see docview.js. The
     document's bytes arrive from main.js via window.kioskDocView.show(). -->
<style>
  html, body { margin: 0; background: #666; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eee; font: 22px sans-serif; text-align: center; padding: 2em; box-sizing: border-box;
  }
</style>
<script src="node_modules/jszip/dist/jszip.min.js"></script>
<script src="node_modules/docx-preview/dist/docx-preview.min.js"></script>
<script src="docx-render.js"></script>
</head>
<body>
<div id="msg">Loading document…</div>
<div id="doc"></div>
<script>
(() => {
  const docEl = document.getElementById('doc');
  const msg = document.getElementById('msg');
  let cls = null;

  function showMessage(text) {
    msg.textContent = text;
    msg.style.display = 'flex';
    docEl.innerHTML = '';
  }

  window.addEventListener('resize', () => cls && KioskDocx.fit(docEl, cls, window.innerWidth));

  window.kioskDocView = {
    async show(d) {
      if (d.error) { showMessage(d.error); return; }
      if (!window.KioskDocx || !KioskDocx.available()) {
        showMessage('Word document viewer is missing (docx-preview) - run Advanced -> Upgrade.');
        return;
      }
      try {
        cls = await KioskDocx.render(KioskDocx.base64ToBytes(d.data), docEl);
        msg.style.display = 'none';
        KioskDocx.fit(docEl, cls, window.innerWidth);
        // Only called on first load or when the file changed on disk -
        // start a changed document from the top.
        window.scrollTo(0, 0);
      } catch (e) {
        showMessage(`Couldn't show ${d.file}: ${e.message || e}`);
      }
    },
  };
})();
</script>
</body>
</html>
