Section "ServerFlags"
    # Disable Ctrl+Alt+Backspace (X server kill)
    Option "DontZap" "true"

    # Allow VT switching (Ctrl+Alt+F1-F8): virtual consoles are ENABLED by
    # default, as the installer says. Advanced -> Virtual Consoles (or the
    # install prompt) turns this to "true" to disable them.
    Option "DontVTSwitch" "false"

    # Don't allow clients to disconnect on exit
    Option "AllowClosedownGrabs" "false"
EndSection
