---
description:
  - "Label sheets and layouts for Tools > Labels (spine labels and barcodes)"
tables:
  - creator_templates:
      translatable: [ template_desc ]
      multiline: [ ]
      rows:
        # Avery 5160 / 8160 - the common 30-up address sheet; fits a spine label
        # plus barcode on one label.
        - template_code: "Avery 5160 | 1 x 2-5/8 (30 per sheet)"
          template_desc: "3 columns, 10 rows. Spine label with barcode."
          page_width: 8.5
          page_height: 11
          label_width: 2.63
          label_height: 1
          top_text_margin: 0.139
          left_text_margin: 0.1
          top_margin: 0.35
          left_margin: 0.23
          cols: 3
          rows: 10
          col_gap: 0.13
          row_gap: 0
          units: "INCH"
          creator: "Labels"

        # Avery 5167 / 8167 - 80-up small labels, good for barcode-only stickers.
        - template_code: "Avery 5167 | 1/2 x 1-3/4 (80 per sheet)"
          template_desc: "4 columns, 20 rows. Barcode-only stickers."
          page_width: 8.5
          page_height: 11
          label_width: 1.75
          label_height: 0.5
          top_text_margin: 0.1
          left_text_margin: 0.05
          top_margin: 0.5
          left_margin: 0.3
          cols: 4
          rows: 20
          col_gap: 0.3
          row_gap: 0
          units: "INCH"
          creator: "Labels"

        # Demco 1" x 1.5" spine labels (Koha's own sample measurements).
        - template_code: "Demco spine | 1 x 1.5 (50 per sheet)"
          template_desc: "5 columns, 10 rows. Dewey / call number on up to four lines."
          page_width: 8.5
          page_height: 11
          label_width: 1.5
          label_height: 1
          top_text_margin: 0.236
          left_text_margin: 0
          top_margin: 0.5
          left_margin: 0.25
          cols: 5
          rows: 10
          col_gap: 0.0625
          row_gap: 0
          units: "INCH"
          creator: "Labels"

  - creator_layouts:
      translatable: [ layout_name, layout_xml ]
      multiline: [ layout_xml ]
      rows:
        # callnum_split splits "613.2 SMI" onto separate lines the way spine
        # labels are normally read (Dewey/LC aware).
        - layout_name: "Spine - call number"
          barcode_type: CODE39
          start_label: 1
          printing_type: BIB
          guidebox: 0
          oblique_title: 0
          font: TB
          font_size: 11
          units: POINT
          callnum_split: 1
          text_justify: C
          format_string: "itemcallnumber"
          layout_xml:
            - "<opt></opt>"
          creator: "Labels"

        - layout_name: "Spine + barcode"
          barcode_type: CODE39
          start_label: 1
          printing_type: BIBBAR
          guidebox: 0
          oblique_title: 0
          font: TB
          font_size: 10
          units: POINT
          callnum_split: 1
          text_justify: C
          format_string: "itemcallnumber"
          layout_xml:
            - "<opt></opt>"
          creator: "Labels"

        - layout_name: "Barcode only"
          barcode_type: CODE39
          start_label: 1
          printing_type: BAR
          guidebox: 0
          oblique_title: 0
          font: TR
          font_size: 10
          units: POINT
          callnum_split: 0
          text_justify: L
          format_string: "barcode"
          layout_xml:
            - "<opt></opt>"
          creator: "Labels"
